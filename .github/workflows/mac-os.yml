name: Free macOS Cloud Desktop (RDP/VNC Edition)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled --version

      - name: Connect GitHub Runner to Your Tailscale Network
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          sudo tailscaled > /dev/null 2>&1 &
          sleep 5
          sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes

      - name: Enable Native macOS Screen Sharing (VNC)
        run: |
          # Enable remote management / screen sharing built into macOS
          sudo defaults write /Library/Preferences/com.apple.AppleRemoteDesktop.server EnableVNC -bool yes
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -users admin -privs -all -restart -agent -privs -all
          echo "VNC Server is running and accessible over your Tailscale IP on port 5900!"

      - name: Keep Runner Alive
        run: |
          echo "Tailscale is live! Connect using any VNC viewer app on your phone."
         sleep 21600
