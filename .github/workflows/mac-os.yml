name: Free macOS Cloud Desktop (VNC Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Install Tailscale and VNC Requirements via Homebrew
      run: |
        brew install tailscale tightvnc xquartz
        sudo tailscale --version
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        sudo tailscaled > /dev/null 2>&1 &
        sleep 5
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes
        
    - name: Configure Independent TightVNC Server Engine
      run: |
        # Create standard VNC storage directories
        mkdir -p ~/.vnc
        
        # Hardcode the plaintext login password profile definition
        # This explicitly writes the hash password for: MacPassword123
        echo "MacPassword123" | vncpasswd -f > ~/.vnc/passwd
        chmod 600 ~/.vnc/passwd
        
        # Boot up a standard display interface instance map
        # This completely replaces the default Apple Screen Sharing layout daemon
        vncserver :1 -geometry 1280x720 -depth 24
        
    - name: Keep Runner Alive
      run: |
        echo "The raw TightVNC Server engine is open on Port 5901!"
        sleep 21600 # Keeps the Mac running for the 6-hour limit
        
