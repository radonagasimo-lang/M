name: Free macOS Cloud Desktop (VNC Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Clean Install Tailscale via Homebrew
      run: |
        brew install tailscale
        sudo tailscale --version
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        sudo tailscaled > /dev/null 2>&1 &
        sleep 5
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes
        
    - name: Activate Native macOS Screen Sharing (VNC)
      run: |
        # 1. Turn on the VNC server on the root console
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
        
        # 2. Fix the kickstart command formatting (removed the broken vncpasswd typo options)
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -clientopts -setvncpassword -vncpassword "MacPassword123" \
          -restart -agent -privs -all
          
        # 3. Open up security preferences for phone apps
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement SecurityConfiguration -dict VNCPasswordAuthenticationOnly -bool true
        
    - name: Keep Runner Alive
      run: |
        echo "The native macOS VNC server is officially fixed and listening on Port 5900!"
        sleep 21600 # Keeps the Mac running for the 6-hour limit
