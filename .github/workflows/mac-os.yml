name: Free macOS Cloud Desktop (AnyDesk Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Download and Install AnyDesk Natively
      run: |
        # Download the official AnyDesk DMG package directly
        curl -L -o AnyDesk.dmg https://anydesk.com
        
        # Mount the disk image and install it to the applications folder
        sudo hdiutil attach AnyDesk.dmg
        sudo cp -R /Volumes/AnyDesk/AnyDesk.app /Applications/
        sudo hdiutil detach /Volumes/AnyDesk
        
    - name: Configure AnyDesk Password and Permissions
      run: |
        # Start AnyDesk service as root administrator
        sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --service &
        sleep 5
        
        # Set your permanent login password: MacPassword123
        echo "MacPassword123" | sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --set-password
        
    - name: Get Your Connection ID and Keep Alive
      run: |
        echo "=================================================="
        echo "👉 YOUR ANYDESK ID IS PRINTED BELOW 👈"
        echo "=================================================="
        # Fetch the unique 9-digit AnyDesk ID for this Mac runner
        /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --get-id
        echo "=================================================="
        
        # Keep the Mac running for the 6-hour limit        sleep 21600
