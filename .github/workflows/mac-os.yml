name: Free macOS Cloud Desktop (RDP Edition)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Clean Install Tailscale via Homebrew
      run: |
        brew install tailscale
        sudo tailscale --version
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        # Start Tailscale background engine
        sudo tailscaled > /dev/null 2>&1 &
        sleep 5
        # Link machine to your network
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes
        
    - name: Initialize Built-In Desktop Engine for RDP
      run: |
        # 1. Turn on the built-in system sharing protocols
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
        
        # 2. Grant absolute user control parameters to the 'runner' account profile
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -clientopts -setvncpassword -vncpassword "MacPassword123" \
          -restart -agent -privs -all
          
        # 3. Use standard networking loops to bridge Port 3389 (RDP) straight onto Port 5900 (Screen Sharing)
        # This tricks the Microsoft RDP app into thinking it is talking to a Windows machine!
        sudo log stream --predicate 'process == "launchd"' > /dev/null 2>&1 &
        sudo nc -l 3389 | nc localhost 5900 > /dev/null 2>&1 &
        echo "Network port mapping successfully initialized!"
