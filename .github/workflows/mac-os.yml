name: Free macOS Cloud Desktop (AnyDesk Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Download and Install AnyDesk via Homebrew
      run: |
        # Use Homebrew to download the verified AnyDesk application package safely
        brew install --cask anydesk
        
    - name: Configure AnyDesk Password and Permissions
      run: |
        # Start AnyDesk background service engine as root administrator
        sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --service &
        sleep 5
        
        # Hardcode your unattended login password profile: MacPassword123
        echo "MacPassword123" | sudo /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --set-password
        
    - name: Get Your Connection ID and Keep Alive
      run: |
        echo "=================================================="
        echo "👉 YOUR ANYDESK ID IS PRINTED BELOW 👈"
        echo "=================================================="
        # Pull the unique 9-digit numeric ID assigned to this Mac server node
        /Applications/AnyDesk.app/Contents/MacOS/AnyDesk --get-id
        echo "=================================================="
        
        # Force the worker runtime instance window to lock open for 6 hours
        sleep 21600
        
