name: Free macOS Cloud Desktop (RDP Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Download and Install Tailscale
      run: |
        curl -fsSL https://tailscale.com | sh
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes
        
    - name: Install and Run Native macOS RDP Engine
      run: |
        # Download the precompiled macrdp binary from GitHub releases
        curl -L -o macrdp.tar.gz https://github.com
        tar -xzf macrdp.tar.gz
        chmod +x macrdp
        
        # Start the RDP server tracking engine with our custom password parameters
        sudo ./macrdp --password "MacPassword123" > /dev/null 2>&1 &
        echo "Native RDP Engine active on default port 3389!"
        
    - name: Keep Runner Alive
      run: |
        echo "Connected to Tailscale! Connect using Microsoft Remote Desktop app."
        sleep 21600 # Keeps the Mac running for the 6-hour limit
