name: Free macOS Cloud Desktop (VNC Fixed)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Download and Install Tailscale via Native Shell
      run: |
        curl -fsSL https://tailscale.com | sh
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud
        
    - name: Force Unlock Apple Screen Sharing for Legacy VNC Connections
      run: |
        # 1. Turn on the VNC server on the root console
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
        
        # 2. Hardcode the absolute security permissions to allow basic VNC authentication passwords
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
          -activate -configure -access -on \
          -clientopts -setvncpasswd -vncpasswd "MacPassword123" \
          -restart -agent -privs -all
          
        # 3. Disable Apple's strict VNC authentication requirement so standard phone apps can read it
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement SecurityConfiguration -dict VNCPasswordAuthenticationOnly -bool true
        
    - name: Keep Runner Alive
      run: |
        echo "The native macOS VNC server is completely unlocked on Port 5900!"
        sleep 21600 # Keeps the Mac running for the 6-hour limit
        
