name: Free macOS Cloud Desktop (RDP Edition)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Clean Install Tailscale and MacRDP via Homebrew
      run: |
        # Use Homebrew to install the official Tailscale engine and the MacRDP utility safely
        brew install tailscale macrdp
        sudo tailscale --version
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        # Boot up the local background server daemon engine
        sudo tailscaled > /dev/null 2>&1 &
        sleep 5
        # Link the machine safely straight into your personal network mesh
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes
        
    - name: Launch Native macOS RDP Engine
      run: |
        # Spin up the unblocked MacRDP server engine listening on Windows port 3389
        sudo macrdp --password "MacPassword123" > /dev/null 2>&1 &
        echo "Native RDP Engine is active and waiting on Port 3389!"
        
    - name: Keep Runner Alive
      run: |
        echo "Tailscale is officially live and green! Connect from your phone app."
        sleep 21600 # Keeps the Mac running for the 6-hour limit
