name: Free macOS Cloud Desktop (Tailscale)
on: workflow_dispatch

jobs:
  build:
    runs-on: macos-latest
    steps:
    - name: Install and Start Tailscale via Homebrew
      run: |
        brew install tailscale
        sudo tailscale --version
        
    - name: Connect GitHub Runner to Your Tailscale Network
      env:
        TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      run: |
        # Launch Tailscale background daemon engine
        sudo tailscaled > /dev/null 2>&1 &
        sleep 5
        # Authenticate and bring the tunnel interface online
        sudo tailscale up --authkey=${TAILSCALE_AUTHKEY} --hostname=github-mac-cloud --accept-routes
        
    - name: Activate built-in macOS Screen Sharing (VNC)
      run: |
        sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCAlwaysStartOnConsole -bool true
        sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -activate -configure -access -on -clientopts -setvncpasswd -vncpasswd "MacPassword123" -restart -agent -privs -all
        
    - name: Keep Runner Alive
      run: |
        echo "Connected to Tailscale successfully! Check your phone app."
        sleep 21600 # Keeps the Mac running for the 6-hour limit
        
